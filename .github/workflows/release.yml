name: Release

# Publishes the GitHub Release page for a version: its notes, taken from
# CHANGELOG.md (scripts/release-notes.ts), and the built site as a zip, ready
# for any static host without Bun. Runs when a `v*` tag is pushed; "Run
# workflow" publishes (or refreshes) one for a tag that already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      # The tagged version itself, at the root, which is what gets built.
      # Nothing else is checked out inside it: a second project nested in
      # the workspace makes Vite pick up the wrong tsconfig.json.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The notes helper and the latest CHANGELOG.md (which holds every
      # version's notes) come from the default branch, kept outside the
      # project, since an older tag has neither the helper nor later notes.
      - name: Notes from CHANGELOG.md
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tools="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools/scripts"
          git show "origin/$DEFAULT_BRANCH:CHANGELOG.md" > "$tools/CHANGELOG.md"
          git show "origin/$DEFAULT_BRANCH:scripts/release-notes.ts" > "$tools/scripts/release-notes.ts"
          bun "$tools/scripts/release-notes.ts" "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Build the site
        run: |
          bun install --frozen-lockfile
          BUILD_VERSION="$VERSION" bun run build

      - name: Zip it
        run: |
          (cd build && zip -qr "$RUNNER_TEMP/shy-safari-$VERSION.zip" .)
          ls -l "$RUNNER_TEMP/shy-safari-$VERSION.zip"

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$RUNNER_TEMP/shy-safari-$VERSION.zip"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Shy Safari $VERSION" --notes-file "$notes"
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" \
              --title "Shy Safari $VERSION" \
              --notes-file "$notes" \
              --verify-tag
          fi
