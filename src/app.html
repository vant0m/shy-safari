<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <script>
      // The page is prerendered without a Scene, which appears only once the
      // saved one is known. Until then, paint the saved Scene's colours so a
      // reload doesn't flash. Keep in step with settings.svelte.ts: the Scene
      // is the Class on screen's, and a Class that has not saved settings of
      // its own still uses the old shared record's.
      try {
        var read = function (key) {
          return JSON.parse(localStorage.getItem(key) || "null") || {};
        };
        var classId = read("class-noise-level:classes").currentId;
        var saved =
          (classId &&
            read("class-noise-level:class:" + classId + ":settings").scene) ||
          read("class-noise-level:settings").scene;
        if (saved) document.documentElement.dataset.scene = saved;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
